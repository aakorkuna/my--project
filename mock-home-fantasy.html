<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carcassonne — Fantasy Mock</title>

    <!-- Decorative, Carcassonne-like vibe (demo only) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        /* parchment + ink */
        --bg: #efe2c6;
        --bg2: #e4d1a6;
        --ink: #241a12;
        --inkSoft: rgba(36, 26, 18, 0.72);

        /* metal + gem */
        --steel: #2b2a2a;
        --bronze: #9a6b2f;
        --bronze2: #d7b067;
        --emerald: #2f6f57;

        /* UI */
        --panel: rgba(255, 255, 255, 0.52);
        --panel2: rgba(255, 255, 255, 0.32);
        --border: rgba(36, 26, 18, 0.25);
        --borderStrong: rgba(36, 26, 18, 0.45);
        --shadow: rgba(0, 0, 0, 0.18);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "IM Fell English", ui-serif, Georgia, serif;

        /* Background scene is rendered by the fixed image below */
        background: #0b0e14;
      }

      .pixel-scene {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        overflow: hidden;
        background: #0b0e14;
      }

      .pixel-scene .bg-img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: center;
        /* keep pixel-art crisp when scaled */
        image-rendering: pixelated;
      }

      /* Soft vignette so the menu stays readable */
      .pixel-scene::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(1000px circle at 50% 35%, rgba(0, 0, 0, 0.06), rgba(0, 0, 0, 0.42) 76%);
      }

      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        position: relative;
        overflow: hidden;
      }

      /* big decorative background title */
      .bg-title {
        position: absolute;
        top: 7vh;
        left: 50%;
        transform: translateX(-50%);
        user-select: none;
        pointer-events: none;
        white-space: nowrap;
        opacity: 0.78;
      }

      .bg-title .word {
        font-family: "Cinzel Decorative", ui-serif, Georgia, serif;
        letter-spacing: 0.22em;
        font-weight: 700;
        font-size: clamp(64px, 9vw, 140px);
        line-height: 1;
        display: flex;
        align-items: baseline;

        /* engraved gold-ish text */
        background: linear-gradient(180deg, var(--bronze2), var(--bronze));
        background: linear-gradient(
          180deg,
          color-mix(in srgb, #fff6b8 86%, white),
          color-mix(in srgb, #ffe06a 88%, white),
          color-mix(in srgb, var(--bronze2) 78%, #ffdf5b),
          color-mix(in srgb, var(--bronze) 92%, black)
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-stroke: 1px rgba(0, 0, 0, 0.22);
        text-shadow:
          /* pixel-ish hard shadow */
          2px 2px 0 rgba(0, 0, 0, 0.26),
          0 1px 0 rgba(255, 255, 255, 0.46),
          0 0 28px rgba(255, 232, 120, 0.56),
          0 0 72px rgba(255, 232, 120, 0.28);
      }

      .bg-title .word .c {
        font-size: 1.85em;
        letter-spacing: 0.02em;
        margin-right: 0.06em;
      }

      .bg-title .word .rest {
        letter-spacing: 0.22em;
      }

      /* “pixel” frame feel: stepped border via box-shadow */
      .panel {
        width: min(560px, 92vw);
        position: relative;
        isolation: isolate;
        padding: 52px 34px 66px;
        margin-top: clamp(90px, 14vh, 170px);
        background: transparent;
        border: 0;
        box-shadow: none;
      }

      .panel::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: 0;
        background:
          /* rolled parchment lips (top/bottom) */
          linear-gradient(
            180deg,
            rgba(0, 0, 0, 0.22) 0px,
            rgba(0, 0, 0, 0.10) 10px,
            rgba(255, 255, 255, 0.08) 38px,
            rgba(255, 255, 255, 0) 62px,
            rgba(255, 255, 255, 0) calc(100% - 62px),
            rgba(255, 255, 255, 0.08) calc(100% - 38px),
            rgba(0, 0, 0, 0.10) calc(100% - 10px),
            rgba(0, 0, 0, 0.22) 100%
          ),
          /* edge burn (left/right) */
          radial-gradient(closest-side at 10% 50%, rgba(120, 62, 22, 0.30), rgba(0, 0, 0, 0) 72%),
          radial-gradient(closest-side at 90% 50%, rgba(120, 62, 22, 0.30), rgba(0, 0, 0, 0) 72%),
          radial-gradient(720px circle at 35% 30%, rgba(154, 107, 47, 0.14), transparent 58%),
          radial-gradient(640px circle at 70% 65%, rgba(47, 111, 87, 0.07), transparent 62%),
          /* fibers */
          repeating-linear-gradient(
            90deg,
            rgba(36, 26, 18, 0.018) 0 1px,
            rgba(255, 255, 255, 0) 1px 8px
          ),
          /* keep the old panel translucency */
          linear-gradient(180deg, rgba(255, 255, 255, 0.46), rgba(255, 255, 255, 0.46));

        box-shadow:
          0 26px 60px rgba(0, 0, 0, 0.28),
          0 0 0 2px rgba(36, 26, 18, 0.16) inset,
          0 0 0 4px rgba(36, 26, 18, 0.08) inset;

        /* zig-zag torn sides like the reference */
        clip-path: polygon(
          6% 0%, 94% 0%,
          96% 4%, 100% 8%, 96% 12%, 100% 16%, 96% 20%, 100% 24%, 96% 28%, 100% 32%, 96% 36%, 100% 40%, 96% 44%,
          100% 48%, 96% 52%, 100% 56%, 96% 60%, 100% 64%, 96% 68%, 100% 72%, 96% 76%, 100% 80%, 96% 84%, 100% 88%, 96% 92%, 100% 96%,
          94% 100%, 6% 100%,
          4% 96%, 0% 92%, 4% 88%, 0% 84%, 4% 80%, 0% 76%, 4% 72%, 0% 68%, 4% 64%, 0% 60%, 4% 56%, 0% 52%, 4% 48%, 0% 44%,
          4% 40%, 0% 36%, 4% 32%, 0% 28%, 4% 24%, 0% 20%, 4% 16%, 0% 12%, 4% 8%, 0% 4%
        );
        pointer-events: none;
      }

      /* ensure content stays above parchment overlay */
      .panel > * {
        position: relative;
        z-index: 1;
      }

      .panel-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 2px 6px 14px;
        border-bottom: 1px solid rgba(36, 26, 18, 0.12);
        margin-bottom: 16px;
      }

      .panel-title {
        font-family: "Cinzel Decorative", ui-serif;
        font-size: 20px;
        letter-spacing: 0.12em;
      }

      .badge {
        font-size: 13px;
        opacity: 0.75;
        letter-spacing: 0.08em;
      }

      .grid {
        display: grid;
        gap: 12px;
      }

      .btn {
        font-family: "Cinzel Decorative", ui-serif, Georgia, serif;
        letter-spacing: 0.04em;
        font-weight: 400;

        width: 100%;
        padding: 14px 14px;
        border-radius: 0;
        border: 2px solid rgba(36, 26, 18, 0.45);
        background: rgba(255, 255, 255, 0.26);
        color: var(--ink);

        box-shadow:
          0 0 0 2px rgba(239, 226, 198, 0.9) inset,
          4px 4px 0 rgba(0, 0, 0, 0.18);

        text-transform: uppercase;
        text-align: center;
        cursor: default;
      }

      .btn--primary {
        border-color: rgba(154, 107, 47, 0.55);
        background:
          rgba(215, 176, 103, 0.26);
      }

      .btn--gem {
        border-color: rgba(47, 111, 87, 0.45);
        background:
          rgba(99, 175, 142, 0.20);
      }

      .hint {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 0;
        border: 2px solid rgba(36, 26, 18, 0.14);
        background: rgba(255, 255, 255, 0.22);
        color: var(--inkSoft);
        font-size: 14px;
        line-height: 1.45;
      }

      .corner {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: min(calc(100% + 220px), calc(92vw + 220px));
        height: 34px;
        border-radius: 999px;
        opacity: 1;
        border: 0;
        pointer-events: none;

        /* handles + caps only (no brown bar bleeding into handles) */
        background:
          /* yellow handles */
          radial-gradient(closest-side at -18px 50%, rgba(255, 235, 190, 0.78), rgba(154, 107, 47, 0.72) 74%, rgba(0, 0, 0, 0) 75%),
          radial-gradient(closest-side at calc(100% + 18px) 50%, rgba(255, 235, 190, 0.78), rgba(154, 107, 47, 0.72) 74%, rgba(0, 0, 0, 0) 75%),
          /* bronze-ish caps */
          radial-gradient(closest-side at 56px 50%,
            color-mix(in srgb, var(--bronze2) 82%, white),
            color-mix(in srgb, var(--bronze2) 52%, var(--bronze)) 54%,
            color-mix(in srgb, var(--bronze) 88%, black) 84%,
            rgba(0, 0, 0, 0) 85%),
          radial-gradient(closest-side at calc(100% - 56px) 50%,
            color-mix(in srgb, var(--bronze2) 82%, white),
            color-mix(in srgb, var(--bronze2) 52%, var(--bronze)) 54%,
            color-mix(in srgb, var(--bronze) 88%, black) 84%,
            rgba(0, 0, 0, 0) 85%);

        filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.34));
      }

      /* wood core (stops before handles) */
      .corner::before {
        content: "";
        position: absolute;
        inset: 0;
        left: 86px;
        right: 86px;
        border-radius: 999px;
        background:
          repeating-linear-gradient(90deg,
            rgba(0, 0, 0, 0.10) 0 2px,
            rgba(255, 255, 255, 0.04) 2px 7px,
            rgba(0, 0, 0, 0.05) 7px 12px),
          linear-gradient(180deg,
            rgba(0, 0, 0, 0.42) 0%,
            rgba(255, 255, 255, 0.18) 22%,
            rgba(255, 255, 255, 0.06) 50%,
            rgba(0, 0, 0, 0.22) 78%,
            rgba(0,  0, 0, 0.42) 100%),
          linear-gradient(180deg, #3b2113 0%, #8e522a 55%, #2a160e 100%);
        border: 2px solid rgba(0, 0, 0, 0.24);
        box-shadow:
          0 2px 0 rgba(255, 255, 255, 0.06) inset,
          0 -10px 16px rgba(0, 0, 0, 0.18) inset;
      }

      .corner.tl { top: -18px; }
      .corner.bl { bottom: -18px; }
      .corner.tr,
      .corner.br { display: none; }

      @media (max-width: 520px) {
        .panel { padding: 52px 20px 64px; }
        .btn { padding: 12px; font-size: 12px; }
        .corner { width: min(calc(100% + 160px), calc(92vw + 160px)); }
        .corner::before { left: 72px; right: 72px; }
      }
    </style>
  </head>

  <body>
    <div class="pixel-scene" aria-hidden="true">
      <img class="bg-img" src="./teory.jpg" alt="" />
    </div>

    <div class="wrap">
      <div class="bg-title" aria-hidden="true">
        <div class="word"><span class="c">C</span><span class="rest">ARCASSONNE</span></div>
      </div>

      <section class="panel" aria-label="Main Menu Mock">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <div class="panel-head">
          <div class="panel-title">MAIN MENU</div>
          <div class="badge">STATIC PREVIEW</div>
        </div>

        <div class="grid">
          <div class="btn">TEST (TILES LIST)</div>
          <div class="btn btn--primary">TRY SOLO</div>
          <div class="btn btn--gem">MULTIPLAYER</div>
          <div class="btn">RULES</div>
        </div>
      </section>
    </div>
  </body>
</html>
